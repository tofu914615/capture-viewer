<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Capture Viewer</title>
    <!-- CSSファイルの読み込み -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="video-container">
    <video autoplay id="v" playsinline></video>
</div>

<div id="controls">
    <div class="controls-row">
        <div class="control-group">
            <label for="video-source">映像入力:</label>
            <select id="video-source"></select>
        </div>
        <div class="control-group">
            <label for="resolution">解像度:</label>
            <select id="resolution">
                <option value="1920x1080">1080p (1920x1080)</option>
                <option value="1280x720">720p (1280x720)</option>
                <option value="640x480">480p (640x480)</option>
            </select>
        </div>
        <button id="fullscreen-btn">全画面表示</button>
    </div>
    
    <div class="controls-row">
        <div class="control-group">
            <label for="audio-source">音声入力:</label>
            <select id="audio-source"></select>
        </div>
        <div class="control-group volume-container">
            <label for="volume-slider">音量:</label>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
        <button id="mute-btn">音声をオフにする</button>
    </div>
</div>

<!-- JSファイルの読み込み（bodyの最後に追加） -->
<script src="script.js"></script>
</body>
</html>
